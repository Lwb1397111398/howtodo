# 注意：这里**不要**加 -Dfile.encoding=UTF-8。
# Gradle 会把测试 worker 的 classpath 写进一个 @argfile，写入时用守护进程的默认字符集，
# 而 JVM 启动器读 @argfile 用的是系统原生字符集（本机为 GBK）。
# 一旦守护进程被改成 UTF-8，含中文的路径（本工程目录就在中文路径下）在传递时被错解码，
# 表现为测试类全部 ClassNotFoundException。源码编解码由 kotlinc/AAPT2 自己按 UTF-8 处理，不依赖这个参数。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=96m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
android.overridePathCheck=true
kotlin.code.style=official
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
ksp.useKSP2=false
